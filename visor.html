<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roadbook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #171312;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .pagina {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 6px;
    }

    .hoja {
      position: relative;
      display: inline-block;
    }

    #canvasPDF {
      display: block;
      background: white;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
    }

    #capaEnlaces {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    .enlacePDF {
      position: absolute;
      display: block;
      pointer-events: auto;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .enlacePDF:hover {
      outline: 2px solid rgba(61,217,172,0.55);
      background: rgba(61,217,172,0.08);
    }

    .navegacion {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: #171312;
    }

    button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #contador {
      color: white;
      background: #2b2422;
      border: 2px solid #3dd9ac;
      border-radius: 18px;
      padding: 9px 14px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .navegacion {
        gap: 6px;
        padding: 7px;
      }

      button {
        padding: 9px 10px;
        font-size: 12px;
      }

      #contador {
        font-size: 12px;
        min-width: 90px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="pagina" id="contenedorPagina">

      <div class="hoja" id="hoja">

        <canvas id="canvasPDF"></canvas>

        <div id="capaEnlaces"></div>

      </div>

    </div>


    <div class="navegacion">

      <button id="anterior" onclick="paginaAnterior()">
        ← Anterior
      </button>

      <div id="contador">
        Página 1
      </div>

      <button id="siguiente" onclick="paginaSiguiente()">
        Siguiente →
      </button>

    </div>

  </div>


  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    const archivosPDF = [
  "./pdfenlacesgith-01-11.pdf",
  "./pdfenlacesgith-12-22.pdf"
];


    let pdfDocumento = null;

    let paginaActual = 1;

    let renderActual = null;


    const contenedorPagina =
      document.getElementById("contenedorPagina");

    const hoja =
      document.getElementById("hoja");

    const canvas =
      document.getElementById("canvasPDF");

    const contexto =
      canvas.getContext("2d");

    const capaEnlaces =
      document.getElementById("capaEnlaces");

    const contador =
      document.getElementById("contador");

    const anterior =
      document.getElementById("anterior");

    const siguiente =
      document.getElementById("siguiente");


    async function cargarPDF() {

      try {

        pdfDocumento =
          await pdfjsLib
           .getDocument(archivoPDF)
            .promise;

        await mostrarPagina();

      } catch (error) {

        console.error(
          "Error al cargar el PDF:",
          error
        );

      }

    }


    async function mostrarPagina() {

      if (!pdfDocumento) {
        return;
      }


      if (renderActual) {

        try {
          renderActual.cancel();
        } catch (error) {
        }

      }


      const pagina =
        await pdfDocumento.getPage(
          paginaActual
        );


      const viewportOriginal =
        pagina.getViewport({
          scale: 1
        });


      const anchoDisponible =
        contenedorPagina.clientWidth - 12;

      const altoDisponible =
        contenedorPagina.clientHeight - 12;


      const escalaAncho =
        anchoDisponible /
        viewportOriginal.width;

      const escalaAlto =
        altoDisponible /
        viewportOriginal.height;


      const escala =
        Math.min(
          escalaAncho,
          escalaAlto
        );


      const viewport =
        pagina.getViewport({
          scale: escala
        });


      const pixelRatio =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.floor(
          viewport.width *
          pixelRatio
        );

      canvas.height =
        Math.floor(
          viewport.height *
          pixelRatio
        );


      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";


      hoja.style.width =
        viewport.width + "px";

      hoja.style.height =
        viewport.height + "px";


      capaEnlaces.style.width =
        viewport.width + "px";

      capaEnlaces.style.height =
        viewport.height + "px";


      contexto.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
      );

      contexto.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      const transform =
        pixelRatio !== 1
          ? [
              pixelRatio,
              0,
              0,
              pixelRatio,
              0,
              0
            ]
          : null;


      renderActual =
        pagina.render({
          canvasContext: contexto,
          viewport: viewport,
          transform: transform
        });


      try {

        await renderActual.promise;

      } catch (error) {

        if (
          error.name !==
          "RenderingCancelledException"
        ) {
          console.error(error);
        }

      }


      await crearEnlaces(
        pagina,
        viewport
      );


      contador.textContent =
        "Página " +
        paginaActual +
        " de " +
        pdfDocumento.numPages;


      anterior.disabled =
        paginaActual === 1;


      siguiente.disabled =
        paginaActual ===
        pdfDocumento.numPages;

    }


    async function crearEnlaces(
      pagina,
      viewport
    ) {

      capaEnlaces.innerHTML = "";


      const anotaciones =
        await pagina.getAnnotations({
          intent: "display"
        });


      for (
        const anotacion
        of anotaciones
      ) {

        if (
          anotacion.subtype !== "Link"
        ) {
          continue;
        }


        if (!anotacion.rect) {
          continue;
        }


        const rect =
          viewport
            .convertToViewportRectangle(
              anotacion.rect
            );


        const izquierda =
          Math.min(
            rect[0],
            rect[2]
          );

        const arriba =
          Math.min(
            rect[1],
            rect[3]
          );

        const ancho =
          Math.abs(
            rect[2] -
            rect[0]
          );

        const alto =
          Math.abs(
            rect[3] -
            rect[1]
          );


        const enlace =
          document.createElement("a");


        enlace.className =
          "enlacePDF";


        enlace.style.left =
          izquierda + "px";

        enlace.style.top =
          arriba + "px";

        enlace.style.width =
          ancho + "px";

        enlace.style.height =
          alto + "px";


        /*
          ENLACES EXTERNOS
        */

        if (
          anotacion.url ||
          anotacion.unsafeUrl
        ) {

          enlace.href =
            anotacion.url ||
            anotacion.unsafeUrl;

          enlace.target =
            "_blank";

          enlace.rel =
            "noopener noreferrer";

        }


        /*
          ENLACES A OTRA PÁGINA
          DEL MISMO PDF
        */

        else if (
          anotacion.dest
        ) {

          enlace.href = "#";


          enlace.addEventListener(
            "click",
            async function(evento) {

              evento.preventDefault();


              try {

                let destino =
                  anotacion.dest;


                if (
                  typeof destino ===
                  "string"
                ) {

                  destino =
                    await pdfDocumento
                      .getDestination(
                        destino
                      );

                }


                if (
                  !Array.isArray(destino) ||
                  !destino[0]
                ) {
                  return;
                }


                const referencia =
                  destino[0];


                let numeroPagina;


                if (
                  typeof referencia ===
                  "object"
                ) {

                  numeroPagina =
                    await pdfDocumento
                      .getPageIndex(
                        referencia
                      );

                } else {

                  numeroPagina =
                    referencia;

                }


                paginaActual =
                  numeroPagina + 1;


                await mostrarPagina();

              } catch (error) {

                console.error(
                  "No se pudo abrir el enlace interno:",
                  error
                );

              }

            }
          );

        }


        /*
          SI NO HAY DESTINO,
          NO AÑADIMOS LA ZONA
        */

        else {

          continue;

        }


        capaEnlaces.appendChild(
          enlace
        );

      }

    }


    window.paginaSiguiente =
      async function() {

        if (
          pdfDocumento &&
          paginaActual <
          pdfDocumento.numPages
        ) {

          paginaActual++;

          await mostrarPagina();

        }

      };


    window.paginaAnterior =
      async function() {

        if (
          pdfDocumento &&
          paginaActual > 1
        ) {

          paginaActual--;

          await mostrarPagina();

        }

      };


    let temporizadorResize;


    window.addEventListener(
      "resize",
      function() {

        clearTimeout(
          temporizadorResize
        );


        temporizadorResize =
          setTimeout(
            function() {
              mostrarPagina();
            },
            150
          );

      }
    );


    cargarPDF();

  </script>

</body>
</html>
