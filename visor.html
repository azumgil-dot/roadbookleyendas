<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roadbook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #171312;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .pagina {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }

    #canvasPDF {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: white;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
    }

    .navegacion {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: #171312;
    }

    button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #contador {
      color: white;
      background: #2b2422;
      border: 2px solid #3dd9ac;
      border-radius: 18px;
      padding: 9px 14px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .navegacion {
        gap: 6px;
        padding: 7px;
      }

      button {
        padding: 9px 10px;
        font-size: 12px;
      }

      #contador {
        font-size: 12px;
        min-width: 90px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="pagina">
      <canvas id="canvasPDF"></canvas>
    </div>

    <div class="navegacion">

      <button id="anterior" onclick="paginaAnterior()">
        ← Anterior
      </button>

      <div id="contador">
        Página 1
      </div>

      <button id="siguiente" onclick="paginaSiguiente()">
        Siguiente →
      </button>

    </div>

  </div>


  <script type="module">

    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.worker.mjs";


    const archivoPDF =
      "./pdfenlacesgith-01-11.pdf";


    let pdfDocumento = null;

    let paginaActual = 1;

    let renderActual = null;


    const canvas =
      document.getElementById("canvasPDF");

    const contexto =
      canvas.getContext("2d");

    const contador =
      document.getElementById("contador");

    const anterior =
      document.getElementById("anterior");

    const siguiente =
      document.getElementById("siguiente");


    async function cargarPDF() {

      const carga =
        pdfjsLib.getDocument(archivoPDF);

      pdfDocumento =
        await carga.promise;

      await mostrarPagina();

    }


    async function mostrarPagina() {

      if (!pdfDocumento) {
        return;
      }


      if (renderActual) {

        try {
          renderActual.cancel();
        } catch (error) {
        }

      }


      const pagina =
        await pdfDocumento.getPage(paginaActual);


      const contenedor =
        document.querySelector(".pagina");


      const viewportOriginal =
        pagina.getViewport({
          scale: 1
        });


      const anchoDisponible =
        contenedor.clientWidth - 12;

      const altoDisponible =
        contenedor.clientHeight - 12;


      const escalaAncho =
        anchoDisponible /
        viewportOriginal.width;

      const escalaAlto =
        altoDisponible /
        viewportOriginal.height;


      const escala =
        Math.min(
          escalaAncho,
          escalaAlto
        );


      const viewport =
        pagina.getViewport({
          scale: escala
        });


      const pixelRatio =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.floor(
          viewport.width *
          pixelRatio
        );

      canvas.height =
        Math.floor(
          viewport.height *
          pixelRatio
        );


      canvas.style.width =
        Math.floor(viewport.width) +
        "px";

      canvas.style.height =
        Math.floor(viewport.height) +
        "px";


      const transform =
        pixelRatio !== 1
          ? [
              pixelRatio,
              0,
              0,
              pixelRatio,
              0,
              0
            ]
          : null;


      renderActual =
        pagina.render({
          canvasContext: contexto,
          viewport: viewport,
          transform: transform
        });


      try {

        await renderActual.promise;

      } catch (error) {

        if (
          error &&
          error.name !== "RenderingCancelledException"
        ) {
          console.error(error);
        }

      }


      contador.textContent =
        "Página " +
        paginaActual +
        " de " +
        pdfDocumento.numPages;


      anterior.disabled =
        paginaActual === 1;


      siguiente.disabled =
        paginaActual ===
        pdfDocumento.numPages;

    }


    window.paginaSiguiente =
      async function() {

        if (
          pdfDocumento &&
          paginaActual <
          pdfDocumento.numPages
        ) {

          paginaActual++;

          await mostrarPagina();

        }

      };


    window.paginaAnterior =
      async function() {

        if (
          pdfDocumento &&
          paginaActual > 1
        ) {

          paginaActual--;

          await mostrarPagina();

        }

      };


    window.addEventListener(
      "resize",
      function() {
        mostrarPagina();
      }
    );


    cargarPDF();

  </script>

</body>
</html>
