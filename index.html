<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leyendas y Misterios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171312;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #imagenPagina {
      display: block;
      width: 100%;
      height: auto;
    }

    .audio {
      width: 100%;
      max-width: 900px;
      padding: 8px 20px 5px;
    }

    #audioPagina {
      display: block;
      width: 100%;
    }

    .navegacion {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 20px 25px;
    }

    button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    #contadorPagina {
      color: white;
      background: #2b2422;
      border: 2px solid #3dd9ac;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      min-width: 120px;
    }

    @media (max-width: 600px) {
      button {
        padding: 10px 12px;
        font-size: 14px;
      }

      #contadorPagina {
        font-size: 13px;
        min-width: 100px;
        padding: 9px 10px;
      }

      .navegacion {
        padding-left: 10px;
        padding-right: 10px;
      }

      .audio {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="pagina">
    <img
      id="imagenPagina"
      src="./Leyendas.png"
      alt="Leyendas y Misterios"
    >
  </div>

  <div class="audio" id="cajaAudio">
    <audio
      id="audioPagina"
      controls
      loop
      preload="metadata"
    ></audio>
  </div>

  <div class="navegacion">

    <button id="anterior" onclick="paginaAnterior()">
      ← Anterior
    </button>

    <div id="contadorPagina">
      Página 1 de 8
    </div>

    <button id="siguiente" onclick="paginaSiguiente()">
      Siguiente →
    </button>

  </div>

  <script>

    const paginas = [
      {
        imagen: "./Leyendas.png",
        titulo: "Leyendas y Misterios",
        audio: ""
      },
      {
        imagen: "./limoges.png",
        titulo: "Leyendas y misterios de Limoges",
        audio: "./iglesia.mp3"
      },
      {
        imagen: "./vitremisterios.png",
        titulo: "Leyendas y misterios de Vitré",
        audio: "./u_o5lu7i5i2p-gato-361799.mp3"
      },
      {
        imagen: "./fourgueresmister.png",
        titulo: "Leyendas y misterios de Fougères",
        audio: "./early-night.mp3"
      },
      {
        imagen: "./etretat misterios.png",
        titulo: "Leyendas y misterios de Étretat",
        audio: "./waves.mp3"
      },
      {
        imagen: "./monitsamisterios.png",
        titulo: "Leyendas y misterios de Mont-Saint-Michel",
        audio: "./templarsounds.mp3"
      },
      {
        imagen: "./rouenmiste.png",
        titulo: "Leyendas y misterios de Rouen",
        audio: "./dragon.mp3"
      },
      {
        imagen: "./Brujas misterios.png",
        titulo: "Leyendas y misterios de Brujas",
        audio: "./carillon2.mp3"
      },
      {
  imagen: "./dammemisterios.png",
  titulo: "Leyendas y misterios de Notre-Dame",
  audio: "./casca.mp3"
},
      {
  imagen: "./gantemisterios.png",
  titulo: "Leyendas y misterios de Gante",
  audio: "./dragon.mp3"
},
    ];

    let paginaActual = 0;

    const imagenPagina =
      document.getElementById("imagenPagina");

    const audioPagina =
      document.getElementById("audioPagina");

    const cajaAudio =
      document.getElementById("cajaAudio");

    const contadorPagina =
      document.getElementById("contadorPagina");

    const botonAnterior =
      document.getElementById("anterior");

    const botonSiguiente =
      document.getElementById("siguiente");


    function mostrarPagina() {

      const pagina = paginas[paginaActual];

      /* IMAGEN */

      imagenPagina.src = pagina.imagen;
      imagenPagina.alt = pagina.titulo;


      /* CONTADOR */

      contadorPagina.textContent =
        "Página " +
        (paginaActual + 1) +
        " de " +
        paginas.length;


      /* BOTONES */

      botonAnterior.disabled =
        paginaActual === 0;

      botonSiguiente.disabled =
        paginaActual === paginas.length - 1;


      /* DETENER AUDIO ANTERIOR */

      audioPagina.pause();
      audioPagina.currentTime = 0;

      audioPagina.removeAttribute("src");


      /* CARGAR AUDIO DE ESTA PÁGINA */

      if (pagina.audio) {

        cajaAudio.style.display = "block";

        audioPagina.src = pagina.audio;

        audioPagina.load();

      } else {

        cajaAudio.style.display = "none";

      }
    }


    function paginaSiguiente() {

  if (paginaActual < paginas.length - 1) {

    paginaActual++;

    mostrarPagina();

    if (paginas[paginaActual].audio) {
      audioPagina.play().catch(function() {
        console.log("El navegador ha bloqueado la reproducción automática.");
      });
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
}


function paginaAnterior() {

  if (paginaActual > 0) {

    paginaActual--;

    mostrarPagina();

    if (paginas[paginaActual].audio) {
      audioPagina.play().catch(function() {
        console.log("El navegador ha bloqueado la reproducción automática.");
      });
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
}


    /* PRECARGAR LAS IMÁGENES */

    paginas.forEach(function(pagina) {

      const img = new Image();

      img.src = pagina.imagen;

    });


    /* MOSTRAR PORTADA */

    mostrarPagina();

  </script>

</body>
</html>
