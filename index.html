<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leyendas y Misterios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171312;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .pagina {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #imagenPagina {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
    }

    .botones {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      padding: 15px 20px 25px;
      gap: 15px;
    }

    button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.25;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="pagina">
    <img id="imagenPagina" src="./Leyendas.png" alt="Leyendas y Misterios">
  </div>

  <div class="botones">
    <button id="anterior" onclick="paginaAnterior()">← Anterior</button>
    <button id="siguiente" onclick="paginaSiguiente()">Siguiente →</button>
  </div>

  <script>
    const paginas = [
      {
        imagen: "./Leyendas.png",
        titulo: "Leyendas y Misterios"
      },
      {
        imagen: "./limoges.png",
        titulo: "Leyendas y misterios de Limoges"
      }
    ];

    let paginaActual = 0;

    function mostrarPagina() {
      document.getElementById("imagenPagina").src = paginas[paginaActual].imagen;
      document.getElementById("imagenPagina").alt = paginas[paginaActual].titulo;

      document.getElementById("anterior").disabled = paginaActual === 0;
      document.getElementById("siguiente").disabled =
        paginaActual === paginas.length - 1;
    }

    function paginaSiguiente() {
      if (paginaActual < paginas.length - 1) {
        paginaActual++;
        mostrarPagina();
        window.scrollTo(0, 0);
      }
    }

    function paginaAnterior() {
      if (paginaActual > 0) {
        paginaActual--;
        mostrarPagina();
        window.scrollTo(0, 0);
      }
    }

    mostrarPagina();
  </script>

</body>
</html>
