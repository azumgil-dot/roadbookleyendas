let paginaActual = 0;


const imagenPagina =
  document.getElementById("imagenPagina");

const audioPagina =
  document.getElementById("audioPagina");

const cajaAudio =
  document.getElementById("cajaAudio");

const contadorPagina =
  document.getElementById("contadorPagina");

const botonAnterior =
  document.getElementById("anterior");

const botonSiguiente =
  document.getElementById("siguiente");

const enlacesIndice =
  document.getElementById("enlacesIndice");


function mostrarPagina(reproducirAudio = false) {

  const pagina = paginas[paginaActual];

  imagenPagina.src = pagina.imagen;
  imagenPagina.alt = pagina.titulo;


  if (pagina.imagen === "./indice.png") {
    enlacesIndice.style.display = "block";
  } else {
    enlacesIndice.style.display = "none";
  }


  contadorPagina.textContent =
    "Página " +
    (paginaActual + 1) +
    " de " +
    paginas.length;


  botonAnterior.disabled =
    paginaActual === 0;

  botonSiguiente.disabled =
    paginaActual === paginas.length - 1;


  audioPagina.pause();

  try {
    audioPagina.currentTime = 0;
  } catch (error) {
  }

  audioPagina.removeAttribute("src");


  if (pagina.audio) {

    cajaAudio.style.display = "block";

    audioPagina.src = pagina.audio;
    audioPagina.load();


    if (reproducirAudio) {

      audioPagina.play().catch(function() {
        console.log(
          "El navegador ha bloqueado la reproducción automática."
        );
      });

    }

  } else {

    cajaAudio.style.display = "none";

  }

}


function paginaSiguiente() {

  if (paginaActual < paginas.length - 1) {

    paginaActual++;

    mostrarPagina(true);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function paginaAnterior() {

  if (paginaActual > 0) {

    paginaActual--;

    mostrarPagina(true);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function irAlIndice() {

  paginaActual = 1;

  mostrarPagina(false);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function irAlRoadbook() {

  window.location.href =
    "https://loscletusroadeurope.my.canva.site/pdfenlaces-pdf";

}


function irADestino(destino) {

  const destinoBuscado =
    destino.toLowerCase();

  const posicion =
    paginas.findIndex(function(pagina) {

      return pagina.titulo
        .toLowerCase()
        .includes(destinoBuscado);

    });


  if (posicion !== -1) {

    paginaActual = posicion;

    mostrarPagina(true);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* PRECARGAR IMÁGENES */

paginas.forEach(function(pagina) {

/* MOSTRAR PORTADA */
