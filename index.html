      align-items: center;

    }

    .pagina {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    #imagenPagina {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ZONAS CLICABLES DEL ÍNDICE */
    #enlacesIndice {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .zona-indice {
      position: absolute;
      display: block;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 0;
      cursor: pointer;
      z-index: 20;
    }

    .zona-indice:hover,
.zona-indice:focus,
.zona-indice:active {
  opacity: 0 !important;
  background: transparent !important;
  outline: none !important;
  box-shadow: none !important;
}

    .audio {
      width: 100%;
      max-width: 900px;
      padding: 8px 20px 5px;
    }

    #audioPagina {
      display: block;
      width: 100%;
    }

    .navegacion {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 20px 25px;
    }

    .navegacion button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .navegacion button:hover {
      opacity: 0.85;
    }

    .navegacion button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    #contadorPagina {
      color: white;
      background: #2b2422;
      border: 2px solid #3dd9ac;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      min-width: 125px;
    }

    @media (max-width: 600px) {
      .navegacion {
        gap: 5px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .navegacion button {

        font-size: 12px;

      #contadorPagina {

        min-width: 82px;

    let paginaActual = 0;


    const imagenPagina =
      document.getElementById("imagenPagina");

    const audioPagina =
      document.getElementById("audioPagina");

    const cajaAudio =
      document.getElementById("cajaAudio");

    const contadorPagina =
      document.getElementById("contadorPagina");

    const botonAnterior =
      document.getElementById("anterior");

    const botonSiguiente =
      document.getElementById("siguiente");

   const enlacesIndice = document.getElementById("enlacesIndice");


    function mostrarPagina(reproducirAudio = false) {

      const pagina = paginas[paginaActual];


      /* IMAGEN */

      imagenPagina.src = pagina.imagen;
      imagenPagina.alt = pagina.titulo;
      
if (pagina.imagen === "./indice.png") {
  enlacesIndice.style.display = "block";
} else {
  enlacesIndice.style.display = "none";
}

      /* ÍNDICE CLICABLE */

      if (pagina.imagen === "./indice.png") {
        enlacesIndice.style.display = "block";
      } else {
        enlacesIndice.style.display = "none";
      }


      /* CONTADOR */

      contadorPagina.textContent =
        "Página " +
        (paginaActual + 1) +
        " de " +
        paginas.length;


      /* BOTONES */

      botonAnterior.disabled =
        paginaActual === 0;

      botonSiguiente.disabled =
        paginaActual === paginas.length - 1;


      /* DETENER AUDIO ANTERIOR */

      audioPagina.pause();

      try {
        audioPagina.currentTime = 0;
      } catch (error) {
      }

      audioPagina.removeAttribute("src");


      /* AUDIO DE LA PÁGINA */

      if (pagina.audio) {

        cajaAudio.style.display = "block";

        audioPagina.src = pagina.audio;
        audioPagina.load();

        if (reproducirAudio) {

          audioPagina.play().catch(function() {
            console.log(
              "El navegador ha bloqueado la reproducción automática."
            );
          });

        }

      } else {

        cajaAudio.style.display = "none";

      }
    }


    function paginaSiguiente() {

      if (paginaActual < paginas.length - 1) {

        paginaActual++;

        mostrarPagina(true);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    }


    function paginaAnterior() {

      if (paginaActual > 0) {

        paginaActual--;

        mostrarPagina(true);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    }


    function irAlIndice() {

      paginaActual = 1;

      mostrarPagina(false);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function irADestino(destino) {

      const destinoBuscado =
        destino.toLowerCase();

      const posicion =
        paginas.findIndex(function(pagina) {

          return pagina.titulo
            .toLowerCase()
            .includes(destinoBuscado);

        });


      if (posicion !== -1) {

        paginaActual = posicion;

        mostrarPagina(true);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }


    /* PRECARGAR IMÁGENES */

    paginas.forEach(function(pagina) {

      const img = new Image();

      img.src = pagina.imagen;

    });


    /* MOSTRAR PORTADA */

    mostrarPagina(false);
