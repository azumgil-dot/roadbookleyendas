<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leyendas y Misterios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171312;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      position: relative;
      margin: 0 auto;
    }

    #imagenPagina {
      display: block;
      width: 100%;
      height: auto;
    }

    .audio-superpuesto {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 15px;
      z-index: 10;
    }

    #audioPagina {
      width: 100%;
      opacity: 0.92;
    }

    .navegacion {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 15px 20px 25px;
    }

    button {
      background: #3dd9ac;
      color: #171312;
      border: none;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    #contadorPagina {
      color: white;
      background: #2b2422;
      border: 2px solid #3dd9ac;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      min-width: 120px;
    }

    @media (max-width: 600px) {

      .audio-superpuesto {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      button {
        padding: 10px 12px;
        font-size: 14px;
      }

      #contadorPagina {
        font-size: 13px;
        min-width: 100px;
        padding: 9px 10px;
      }

      .navegacion {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="pagina">

    <img
      id="imagenPagina"
      src="./Leyendas.png"
      alt="Leyendas y Misterios"
    >

    <div class="audio-superpuesto" id="cajaAudio">
      <audio id="audioPagina" controls loop></audio>
    </div>

  </div>

  <div class="navegacion">

    <button id="anterior" onclick="paginaAnterior()">
      ← Anterior
    </button>

    <div id="contadorPagina">
      Página 1 de 6
    </div>

    <button id="siguiente" onclick="paginaSiguiente()">
      Siguiente →
    </button>

  </div>

  <script>

    const paginas = [
      {
        imagen: "./Leyendas.png",
        titulo: "Leyendas y Misterios",
        audio: ""
      },
      {
        imagen: "./limoges.png",
        titulo: "Leyendas y misterios de Limoges",
        audio: "./iglesia.mp3"
      },
      {
        imagen: "./vitremisterios.png",
        titulo: "Leyendas y misterios de Vitré",
        audio: "./u_o5lu7i5i2p-gato-361799.mp3"
      },
      {
        imagen: "./fourgueresmister.png",
        titulo: "Leyendas y misterios de Fougères",
        audio: "./early-night.mp3"
      },
      {
        imagen: "./etretat misterios.png",
        titulo: "Leyendas y misterios de Étretat",
        audio: "./waves.mp3"
      },
      {
        imagen: "./monitsamisterios.png",
        titulo: "Leyendas y misterios de Mont-Saint-Michel",
        audio: "./templarsounds.mp3"
      },
      {
  imagen: "./rouenmiste.png",
  titulo: "Leyendas y misterios de Rouen",
  audio: "./dragon.mp3"
},
{
  imagen: "./Brujas misterios.png",
  titulo: "Leyendas y misterios de Brujas",
  audio: "./carrillon2.mp3"
}
    ];

    let paginaActual = 0;

    function mostrarPagina() {

      const imagen = document.getElementById("imagenPagina");
      const audio = document.getElementById("audioPagina");
      const cajaAudio = document.getElementById("cajaAudio");
      const contador = document.getElementById("contadorPagina");

      imagen.src = paginas[paginaActual].imagen;
      imagen.alt = paginas[paginaActual].titulo;

      contador.textContent =
        "Página " + (paginaActual + 1) + " de " + paginas.length;

      document.getElementById("anterior").disabled =
        paginaActual === 0;

      document.getElementById("siguiente").disabled =
        paginaActual === paginas.length - 1;

      audio.pause();
      audio.removeAttribute("src");

      if (paginas[paginaActual].audio !== "") {

        audio.src = paginas[paginaActual].audio;
        cajaAudio.style.display = "block";
        audio.load();

        audio.play().catch(function() {
          console.log("Pulsa Play para iniciar el sonido.");
        });

      } else {

        cajaAudio.style.display = "none";

      }
    }

    function paginaSiguiente() {

      if (paginaActual < paginas.length - 1) {

        paginaActual++;
        mostrarPagina();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    }

    function paginaAnterior() {

      if (paginaActual > 0) {

        paginaActual--;
        mostrarPagina();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    }

    mostrarPagina();

  </script>

</body>
</html>
